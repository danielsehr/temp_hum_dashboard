<!DOCTYPE html>

<html>

<head>
    <title>ESP32 Dashboard</title>
</head>

<body>
    <h1>
        ESP32 Environment Dashboard
    </h1>
    <div>
        <h2>Temperature</h2>
        <p id="temperature">
            -- °C
        </p>
    </div>

    <div>
        <h2>Humidity</h2>
        <p id="humidity">
            -- %
        </p>
    </div>

    <p>
        Connection:
        <span id="status">
            Disconnected
        </span>
    </p>

    <script src="dashboard.js"></script>

</body>

</html>
