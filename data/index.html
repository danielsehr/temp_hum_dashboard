<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobioreactor Dashboard</title>
</head>

<body>
    <h1>
        ESP32 Environment Dashboard
    </h1>
    <div>
        <h2>Temperature</h2>
        <p id="temperature">
            -- °C
        </p>
    </div>

    <div>
        <h2>Humidity</h2>
        <p id="humidity">
            -- %
        </p>
    </div>

    <p>
        Connection:
        <span id="status">
            Disconnected
        </span>
    </p>

    <h2>
        Chart
    </h2>

    <canvas id="chart"></canvas>

    <script src="chart.min.js"></script>
    <script src="dashboard.js"></script>

</body>

</html>
